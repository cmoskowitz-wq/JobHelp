# ============================================================
#  JobHelp Version 3 — Configuration File
#  Edit this file to customize boards, titles, schedule,
#  AI scoring, notifications, geo-priority, and dashboard.
# ============================================================

version: "JobHelp Version 3"

# ── Job titles to search for ────────────────────────────────
job_titles:
  - "CTO"
  - "CIO"
  - "VP of Technology"
  - "Head of IT"
  - "Head of Infrastructure"
  - "SVP of Technology"
  - "EUC"
  - "Director of Technology"

# ── Job boards ───────────────────────────────────────────────
job_boards:

  indeed:
    enabled: true
    base_url: "https://www.indeed.com"

  linkedin:
    enabled: true
    base_url: "https://www.linkedin.com"
    # v3 fix: LinkedIn now tries a lightweight guest API first (no browser).
    # If that returns 0 results it falls back to Playwright with extended jitter.
    # Adjust min_interval_minutes to throttle repeat runs (0 = no throttle).
    min_interval_minutes: 0

  ziprecruiter:
    enabled: true
    base_url: "https://www.ziprecruiter.com"

  glassdoor:
    enabled: true
    base_url: "https://www.glassdoor.com"

  dice:
    enabled: true
    base_url: "https://www.dice.com"

  simplyhired:
    enabled: true
    base_url: "https://www.simplyhired.com"

  monster:
    enabled: true
    base_url: "https://www.monster.com"

  themuse:
    enabled: true
    base_url: "https://www.themuse.com/api/public"

  adzuna:
    enabled: false   # Set true after obtaining free API keys at developer.adzuna.com
    app_id: ""
    app_key: ""
    country: "us"

  careerbuilder:
    enabled: true
    base_url: "https://www.careerbuilder.com"

  remoteok:
    enabled: true
    base_url: "https://remoteok.com/api"

  jobicy:
    enabled: true
    base_url: "https://jobicy.com/api/v2"

  # ── New in v3 ─────────────────────────────────────────────
  builtin:
    enabled: true
    # Builtin.com — tech-focused board with strong NY/NJ metro coverage.
    base_url: "https://builtin.com"

  wellfound:
    enabled: true
    # Wellfound (formerly AngelList Talent) — startup + growth-stage tech roles.
    base_url: "https://wellfound.com"

# ── Search filters ────────────────────────────────────────────
search:
  hours_ago: 24          # Only return jobs posted within this many hours
  location: ""           # Leave blank to search nationally; e.g. "New York, NY"
  remote_ok: true        # Include remote positions
  results_per_board: 25  # Max results per board per title (where supported)

# ── Geo-priority ──────────────────────────────────────────────
# Jobs whose location matches any of these keywords will be sorted
# to the top of each section and highlighted with a gold border in
# the email and a 📍 badge in the dashboard.
geo_priority:
  regions:
    - "new jersey"
    - " nj"
    - ", nj"
    - "(nj)"
    - "connecticut"
    - " ct"
    - ", ct"
    - "(ct)"
    - "new york city"
    - "nyc"
    - "new york, ny"
    - " ny,"
    - "manhattan"
    - "brooklyn"
    - "queens"
    - "bronx"
    - "staten island"
    - "jersey city"
    - "hoboken"
    - "newark"
    - "stamford"
    - "hartford"
    - "bridgeport"
    - "new haven"

# ── AI scoring (Claude) ───────────────────────────────────────
# Requires: ANTHROPIC_API_KEY environment variable
# Each job receives a score 0–10 and a one-sentence match summary.
ai:
  enabled: false           # Set to true to enable (requires ANTHROPIC_API_KEY)
  model: "claude-haiku-4-5-20251001"   # Fast + cheap; upgrade to Sonnet for more nuance
  batch_size: 20           # Jobs per API call (keep ≤ 30 for best JSON reliability)
  min_score: 0             # Filter out jobs below this score (0 = keep all)
  profile: |
    Experienced technology executive (CTO / CIO / VP of Technology) with 15+ years
    leading enterprise IT, infrastructure, and engineering teams. Background includes
    digital transformation, cloud strategy, end-user computing (EUC), and large-scale
    programme delivery. Prefer roles in NJ, CT, or the NYC metro area.
    Salary target: $250,000+.

# ── Notifications ─────────────────────────────────────────────
notifications:
  slack:
    enabled: false
    webhook_url: ""        # or set SLACK_WEBHOOK_URL env var
    max_jobs: 10           # top N jobs to mention (by AI score then recency)

  sms:
    enabled: false
    account_sid: ""        # or set TWILIO_ACCOUNT_SID env var
    auth_token: ""         # or set TWILIO_AUTH_TOKEN env var
    from_number: ""        # Twilio number, e.g. "+15551234567"
    to_number: ""          # Your number, e.g. "+19735551234"
    max_jobs: 5

# ── Email settings ────────────────────────────────────────────
email:
  recipient: "cmoskowitz@gmail.com"
  sender: ""             # Your sending address, e.g. you@gmail.com
  sender_name: "JobHelp Bot"
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  use_tls: true
  password: ""           # Gmail App Password (not your regular password)

  # Schedule: "daily", "hourly", or "HH:MM"
  schedule: "daily"
  daily_time: "08:00"
  timezone: "America/New_York"

# ── Web dashboard ─────────────────────────────────────────────
# Launch with: python main.py --dashboard
# Or:          python dashboard.py
dashboard:
  port: 5000
  host: "0.0.0.0"
